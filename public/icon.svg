<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Fundo Circular com borda elegante -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" opacity="0.4"/>

  <!-- Ícone de Moto Estilizada / Financeira -->
  <g transform="translate(64, 90)">
    <!-- Roda Traseira -->
    <circle cx="80" cy="230" r="56" fill="none" stroke="url(#emeraldGrad)" stroke-width="18"/>
    <circle cx="80" cy="230" r="24" fill="#10b981" opacity="0.3"/>

    <!-- Roda Dianteira -->
    <circle cx="304" cy="230" r="56" fill="none" stroke="url(#emeraldGrad)" stroke-width="18"/>
    <circle cx="304" cy="230" r="24" fill="#10b981" opacity="0.3"/>

    <!-- Chassi e Corpo da Moto -->
    <path d="M80 230 L160 210 L230 140 L304 230 M160 210 L195 120 L270 120 M195 120 L230 140" fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Guidão -->
    <path d="M260 95 L285 120 L300 110" fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>

    <!-- Tanque / Banco -->
    <path d="M140 180 Q190 150 240 180" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Moeda / Cifrão de Crédito -->
    <circle cx="192" cy="50" r="48" fill="url(#goldGrad)"/>
    <text x="192" y="66" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#0f172a" text-anchor="middle">$</text>
  </g>

  <!-- Texto Inferior Vando Motos -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="2" text-anchor="middle">VANDO MOTOS</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#10b981" letter-spacing="4" text-anchor="middle">LOCADORA LTDA</text>
</svg>
