<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sistema de Gestão de Empréstimos, Contratos e Notas Promissórias - Vando Motos Locadora LTDA." />
    <meta name="theme-color" content="#07080a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>Vando Motos - Gestão de Empréstimos</title>
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
    </script>
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body>
    <div class="app-container" id="app">

      <!-- Backdrop do menu mobile -->
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- SIDEBAR DESKTOP & GAVETA MOBILE -->
      <aside class="sidebar" id="app-sidebar">
        <div class="brand-section">
          <img src="/logo-vandomotos.png" alt="Vando Motos Locadora" class="brand-logo-img" id="display-brand-logo" />
          <button class="mobile-drawer-close" id="btn-close-sidebar" aria-label="Fechar Menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <nav class="nav-menu">
          <button class="nav-item active" data-tab="dashboard" id="nav-btn-dashboard">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
            </span>
            <span class="nav-label">Dashboard</span>
          </button>

          <button class="nav-item" data-tab="loans" id="nav-btn-loans">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
              </svg>
            </span>
            <span class="nav-label">Simular & Empréstimos</span>
          </button>

          <button class="nav-item" data-tab="installments" id="nav-btn-installments">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                <line x1="1" y1="10" x2="23" y2="10"></line>
              </svg>
            </span>
            <span class="nav-label">Parcelas & Cobrança</span>
            <span class="nav-badge" id="badge-overdue-count" style="display: none;">0</span>
          </button>

          <button class="nav-item" data-tab="renegotiation" id="nav-btn-renegotiation">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"></polyline>
                <polyline points="23 20 23 14 17 14"></polyline>
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
              </svg>
            </span>
            <span class="nav-label">Renegociar Dívida</span>
          </button>

          <button class="nav-item" data-tab="clients" id="nav-btn-clients">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </span>
            <span class="nav-label">Clientes</span>
          </button>

          <button class="nav-item" data-tab="reports" id="nav-btn-reports">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
            </span>
            <span class="nav-label">Relatórios</span>
          </button>

          <button class="nav-item" data-tab="settings" id="nav-btn-settings">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </span>
            <span class="nav-label">Configurações & PIX</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="business-badge">
            <img src="/logo-vandomotos.png" class="business-avatar-logo" alt="Vando Motos" />
            <div class="business-badge-text">
              <div class="business-name" id="footer-business-name">Vando motos locadora LTDA</div>
              <div class="business-role">CNPJ: 28.623.431-0001-23</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- WRAPPER PRINCIPAL -->
      <main class="main-wrapper">

        <!-- HEADER SUPERIOR -->
        <header class="top-header">
          <div class="header-left">
            <button class="mobile-menu-btn" id="mobile-toggle-btn" aria-label="Abrir Menu">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
            <img src="/logo-vandomotos.png" class="header-logo-compact" alt="Vando Motos" />
            <div class="page-title-group">
              <h1 id="top-page-title">Painel Geral</h1>
              <p id="top-page-subtitle">Acompanhamento em tempo real</p>
            </div>
          </div>

          <div class="header-actions">
            <button class="header-icon-btn" id="btn-header-search" title="Buscar (Ctrl+K)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
            <button class="header-icon-btn header-desktop-only" id="btn-header-caixa" title="Caixa Diário">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                <circle cx="12" cy="12" r="2"></circle>
                <path d="M6 12h.01M18 12h.01"></path>
              </svg>
            </button>
            <button class="header-icon-btn header-desktop-only" id="btn-header-quick-sim" title="Simulador Rápido">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
              </svg>
            </button>
            <button class="header-icon-btn header-icon-btn--primary" id="btn-header-quick-client" title="Novo Cliente">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>
        </header>

        <!-- CONTEÚDO PRINCIPAL (RENDERIZADO VIA JS) -->
        <section class="page-content" id="main-content-view">
          <!-- Renderizado dinamicamente -->
        </section>

      </main>

      <!-- BARRA DE NAVEGAÇÃO INFERIOR NATIVA MOBILE (PWA / SMARTPHONES) -->
      <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Navegação Principal Mobile">
        <button class="bottom-nav-item active" data-tab="dashboard">
          <div class="bottom-nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
          </div>
          <span class="bottom-nav-label">Início</span>
        </button>

        <button class="bottom-nav-item" data-tab="loans">
          <div class="bottom-nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </div>
          <span class="bottom-nav-label">Simular</span>
        </button>

        <button class="bottom-nav-item" data-tab="installments">
          <div class="bottom-nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
              <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
            <span class="bottom-nav-badge" id="bottom-badge-overdue" style="display: none;">0</span>
          </div>
          <span class="bottom-nav-label">Cobrança</span>
        </button>

        <button class="bottom-nav-item" data-tab="clients">
          <div class="bottom-nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
          <span class="bottom-nav-label">Clientes</span>
        </button>

        <button class="bottom-nav-item" id="btn-bottom-more">
          <div class="bottom-nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="19" cy="12" r="1"></circle>
              <circle cx="5" cy="12" r="1"></circle>
            </svg>
          </div>
          <span class="bottom-nav-label">Mais</span>
        </button>
      </nav>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
